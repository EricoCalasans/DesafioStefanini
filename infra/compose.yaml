name: coe-leader-challenge

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run infra/setup-local.ps1 first}
      ORDERS_RUNTIME_PASSWORD: ${ORDERS_RUNTIME_PASSWORD:?Run infra/setup-local.ps1 first}
      ORDERS_MIGRATOR_PASSWORD: ${ORDERS_MIGRATOR_PASSWORD:?Run infra/setup-local.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:8.0.34-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run infra/setup-local.ps1 first}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo-bootstrap:
    image: mongo:8.0.34-noble
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CATALOG_RUNTIME_PASSWORD: ${CATALOG_RUNTIME_PASSWORD:?Run infra/setup-local.ps1 first}
      CATALOG_SEED_PASSWORD: ${CATALOG_SEED_PASSWORD:?Run infra/setup-local.ps1 first}
    entrypoint: ["mongosh"]
    command:
      - "${MONGO_ADMIN_URI:?Run infra/setup-local.ps1 first}"
      - "--quiet"
      - "--file"
      - "/scripts/bootstrap.js"
    volumes:
      - ./mongo/bootstrap.js:/scripts/bootstrap.js:ro
    restart: "no"

  catalog:
    image: coe-catalog:local
    build:
      context: ../catalogo-dotnet
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CATALOG_MONGODB_URI: ${CATALOG_MONGODB_URI:?Run infra/setup-local.ps1 first}
      CATALOG_MONGODB_DATABASE: ${CATALOG_MONGODB_DATABASE:-catalog}
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8080}:8080"
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  orders-migrate:
    image: coe-orders:local
    command: ["node", "dist/migrations/run.js"]
    environment:
      ORDERS_MIGRATION_DATABASE_URL: ${ORDERS_MIGRATION_DATABASE_URL:?Run infra/setup-local.ps1 first}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orders:
    image: coe-orders:local
    build:
      context: ../pedidos-typescript
      dockerfile: Dockerfile
    environment:
      ORDERS_PORT: "3000"
      ORDERS_DATABASE_URL: ${ORDERS_DATABASE_URL:?Run infra/setup-local.ps1 first}
      ORDERS_MIGRATION_DATABASE_URL: ${ORDERS_MIGRATION_DATABASE_URL:?Run infra/setup-local.ps1 first}
      CATALOG_URL: http://catalog:8080
      DISCOUNT_ENABLED: ${DISCOUNT_ENABLED:?Run infra/setup-local.ps1 first}
      DISCOUNT_RULE_ID: ${DISCOUNT_RULE_ID:?Run infra/setup-local.ps1 first}
      DISCOUNT_MIN_SUBTOTAL_CENTS: ${DISCOUNT_MIN_SUBTOTAL_CENTS:?Run infra/setup-local.ps1 first}
      DISCOUNT_RATE_BPS: ${DISCOUNT_RATE_BPS:?Run infra/setup-local.ps1 first}
    ports:
      - "127.0.0.1:${ORDERS_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
