name: verify

on:
  push:
    branches: [main, develop, master, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: pedidos-typescript/.node-version
          cache: npm
          cache-dependency-path: pedidos-typescript/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: catalogo-dotnet/global.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pedidos - install and verify
        working-directory: pedidos-typescript
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run lint
          npm test

      - name: Catálogo - restore
        working-directory: catalogo-dotnet
        run: dotnet restore Catalog.sln --locked-mode

      - name: Catálogo - format
        working-directory: catalogo-dotnet
        run: dotnet format Catalog.sln --verify-no-changes --no-restore

      - name: Catálogo - build
        working-directory: catalogo-dotnet
        run: dotnet build Catalog.sln --configuration Release --no-restore

      - name: Catálogo - test
        working-directory: catalogo-dotnet
        run: dotnet test Catalog.sln --configuration Release --no-build --no-restore

      - name: Validate contracts and documentation
        run: |
          python -m pip install -r docs/validation/requirements-documentacao.txt
          python docs/validation/validar-especificacoes.py

      - name: Prepare ephemeral database credentials
        shell: bash
        run: |
          set -euo pipefail
          postgres_admin_password="$(openssl rand -hex 32)"
          orders_runtime_password="$(openssl rand -hex 32)"
          orders_migrator_password="$(openssl rand -hex 32)"
          mongo_root_password="$(openssl rand -hex 32)"
          catalog_runtime_password="$(openssl rand -hex 32)"
          catalog_seed_password="$(openssl rand -hex 32)"
          for value in "$postgres_admin_password" "$orders_runtime_password" "$orders_migrator_password" "$mongo_root_password" "$catalog_runtime_password" "$catalog_seed_password"; do
            echo "::add-mask::$value"
          done
          env_file="$RUNNER_TEMP/challenge.env"
          {
            printf 'POSTGRES_PORT=5432\nMONGO_PORT=27017\nORDERS_PORT=3000\nCATALOG_PORT=8080\n'
            printf 'POSTGRES_ADMIN_PASSWORD=%s\n' "$postgres_admin_password"
            printf 'ORDERS_RUNTIME_PASSWORD=%s\n' "$orders_runtime_password"
            printf 'ORDERS_MIGRATOR_PASSWORD=%s\n' "$orders_migrator_password"
            printf 'MONGO_ROOT_PASSWORD=%s\n' "$mongo_root_password"
            printf 'CATALOG_RUNTIME_PASSWORD=%s\n' "$catalog_runtime_password"
            printf 'CATALOG_SEED_PASSWORD=%s\n' "$catalog_seed_password"
            printf 'ORDERS_DATABASE_URL=postgresql://orders_runtime:%s@postgres:5432/orders\n' "$orders_runtime_password"
            printf 'ORDERS_MIGRATION_DATABASE_URL=postgresql://orders_migrator:%s@postgres:5432/orders\n' "$orders_migrator_password"
            printf 'ORDERS_TEST_DATABASE_URL=postgresql://orders_runtime:%s@postgres:5432/orders_test\n' "$orders_runtime_password"
            printf 'ORDERS_TEST_MIGRATION_DATABASE_URL=postgresql://orders_migrator:%s@postgres:5432/orders_test\n' "$orders_migrator_password"
            printf 'CATALOG_MONGODB_URI=mongodb://catalog_runtime:%s@mongo:27017/catalog?authSource=catalog\n' "$catalog_runtime_password"
            printf 'CATALOG_MONGODB_DATABASE=catalog\n'
            printf 'MONGO_ADMIN_URI=mongodb://mongo_root:%s@mongo:27017/admin?authSource=admin\n' "$mongo_root_password"
            printf 'CATALOG_URL=http://catalog:8080\nDISCOUNT_ENABLED=true\nDISCOUNT_RULE_ID=volume-v1\nDISCOUNT_MIN_SUBTOTAL_CENTS=50000\nDISCOUNT_RATE_BPS=1000\n'
          } > "$env_file"
          printf 'CHALLENGE_ENV_FILE=%s\n' "$env_file" >> "$GITHUB_ENV"
          printf 'ORDERS_TEST_DATABASE_URL=postgresql://orders_runtime:%s@127.0.0.1:5432/orders_test\n' "$orders_runtime_password" >> "$GITHUB_ENV"
          printf 'ORDERS_TEST_MIGRATION_DATABASE_URL=postgresql://orders_migrator:%s@127.0.0.1:5432/orders_test\n' "$orders_migrator_password" >> "$GITHUB_ENV"

      - name: Start isolated services and run database migrations
        run: docker compose --env-file "$CHALLENGE_ENV_FILE" -f infra/compose.yaml up -d --build --wait

      - name: Pedidos - PostgreSQL integration tests
        run: bash infra/test-orders.sh

      - name: Run end-to-end smoke against both APIs
        run: node infra/smoke-system.mjs

      - name: Validate live responses against OpenAPI contracts
        run: python docs/validation/validar-contratos-runtime.py

      - name: Stop ephemeral services
        if: always()
        shell: bash
        run: |
          if [[ -n "${CHALLENGE_ENV_FILE:-}" && -f "$CHALLENGE_ENV_FILE" ]]; then
            docker compose --env-file "$CHALLENGE_ENV_FILE" -f infra/compose.yaml down --volumes --remove-orphans
          fi
